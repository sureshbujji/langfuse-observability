name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile src/*.py tests/*.py
      - name: Run tests (no keys, no network)
        env:
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: python -m pytest -q
      - name: Mock-mode smoke test (seed + dashboard, offline)
        run: |
          python src/seed_traces.py
          python src/build_dashboard.py
          test -f reports/dashboard.html
          grep -q "LLM Observability Dashboard" reports/dashboard.html
